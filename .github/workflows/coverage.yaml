name: coverage
# Code coverage of the RTL tests: the cocotb tests of test.yaml run on Verilator with line,
# branch and toggle coverage (test/Makefile, SIM=verilator). cocotb 2.0 needs Verilator 5.036
# or later; Ubuntu 24.04 packages 5.020, so Verilator is built from its release tag and cached.
on: [push, workflow_dispatch]
# On cmos5l and tags every run is kept; on other branches a newer push cancels the older run.
concurrency:
  group: ${{ (github.ref == 'refs/heads/cmos5l' || startsWith(github.ref, 'refs/tags/')) && format('coverage-run-{0}', github.run_id) || format('coverage-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      VERILATOR_VERSION: v5.042
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v5
        with:
          path: ~/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-ubuntu-24.04

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y help2man perl make autoconf g++ flex bison libfl2 libfl-dev zlib1g zlib1g-dev
          git clone --depth 1 --branch "$VERILATOR_VERSION" https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install

      - name: Add Verilator to the path
        shell: bash
        run: echo "$HOME/verilator/bin" >> "$GITHUB_PATH"

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Keep the unit-test copies of the line helper apart (this job's checkout only)
        shell: bash
        run: python coverage/split.py .

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          verilator --version
          cd test
          make clean
          make SIM=verilator 2>&1 | tee coverage_sim.log
          # make returns success even if tests fail, so check results.xml
          python -m cocotb_tools.check_results results.xml

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cd test
          # Raw (as published), chip and chip-with-exclusions figures, per-file raw table, holes (coverage/scope.py).
          excl=()
          if [ -f ../coverage/exclusions.csv ]; then excl=(--exclusions ../coverage/exclusions.csv); fi
          scope_rc=0
          python ../coverage/scope.py coverage.dat --info ../info.yaml --src ../src "${excl[@]}" \
            --holes coverage_holes.csv --toggle-holes coverage_toggle_holes.txt > coverage_summary.md || scope_rc=$?
          cat coverage_summary.md
          echo "## Coverage of the RTL tests (Verilator $VERILATOR_VERSION)" >> "$GITHUB_STEP_SUMMARY"
          cat coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
          # The same table as an annotation, readable through the public API without sign-in.
          echo "::notice title=coverage summary::$(sed -e 's/%/%25/g' coverage_summary.md | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          verilator_coverage --annotate coverage_annotated --annotate-all --annotate-min 1 coverage.dat
          # Source lines with no coverage point hit ("%" in the annotated files), test bench left out.
          missed=$(grep -rn --include='*.v' '^%' coverage_annotated | grep -v '/tb\.v:' || true)
          echo "::notice title=lines with no point hit::$(printf '%s\n' "${missed:-none}" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          verilator_coverage --write-info coverage.info coverage.dat
          # A stale exclusion list (an excluded point hit, or no longer in the RTL) fails the job.
          exit $scope_rc

      - name: Test Summary
        uses: test-summary/action@v2.6
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            test/coverage.dat
            test/coverage.info
            test/coverage_summary.md
            test/coverage_annotated/
            test/coverage_sim.log
            test/results.xml

      - name: Fail on test failures
        if: steps.tests.outcome == 'failure'
        run: exit 1

name: docs

# Documentation, on every push:
# - datasheet: the Tiny Tapeout check of info.yaml and docs/info.md and the datasheet PDF (template action);
# - waveforms: protocol tests of test/test_rtl_fw.py on the RTL with the pin VCD (test/tb.v PIN_VCD), and the
#   waveform figures (figures/waves.py); the VCDs are kept in the cache while the RTL and the tests do not change;
# - site: the block diagram from the RTL (Yosys), the layout render (KLayout) and the results page from the newest
#   finished gds, test, coverage and formal runs, and the documentation site (mkdocs --strict, mkdocs.yml);
# - sim: the browser simulator and its checks (.github/workflows/sim.yaml); the site job puts it under sim/, so the site
#   is deployed only when the simulator's checks have passed;
# - deploy: GitHub Pages, from the default branch only.
# The site is built again when a gds, test, coverage or formal run of the default branch ends, so that its figures and
# results come from the newest finished runs. This is the only workflow that deploys Pages (a repository has one Pages
# site); the site keeps the layout file for the 3D viewer under viewer/.

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: [gds, test, coverage, formal]
    types: [completed]
    branches: [cmos5l]

permissions:
  contents: read
  actions: read
  checks: read

# Queue, do not cancel: one push starts four workflows, and each one that ends starts this workflow again. With
# cancel-in-progress a build (about 13 min) was cancelled by the next one and nothing was deployed for an hour. Now
# the running build finishes and deploys, and only the newest waiting build runs after it.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  datasheet:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttihp27a

  waveforms:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Pin VCDs of this RTL and these tests
        id: cache
        uses: actions/cache@v5
        with:
          path: build/vcd
          key: pin-vcd-${{ hashFiles('src/**', 'test/**', 'fw/**', 'model/**', 'asm/**') }}

      - name: Install iverilog
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Protocol tests on the RTL with the pin VCD
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build/vcd
          cd test
          for t in test_rtl_uart_tx test_rtl_spi_ctl test_rtl_i2c test_rtl_can; do
            rm -f pins.vcd results.xml
            make PIN_VCD=1 FST= COCOTB_TEST_MODULES=test_rtl_fw COCOTB_TEST_FILTER=$t
            # make returns success even if the test fails, so check results.xml
            python -m cocotb_tools.check_results results.xml
            mv pins.vcd ../build/vcd/$t.vcd
          done
          ls -l ../build/vcd
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > ../build/vcd/run.txt

      - name: Waveform figures
        run: python figures/waves.py build/vcd build/figures

      - name: Upload the figures
        uses: actions/upload-artifact@v7
        with:
          name: waveform-figures
          path: build/figures

  sim:
    uses: ./.github/workflows/sim.yaml

  site:
    needs: [waveforms, sim]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install -r test/requirements.txt mkdocs==1.6.1 mkdocs-material==9.6.23 klayout==0.30.13

      - name: Newest finished CI runs and their artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python figures/runs.py "${{ github.event.workflow_run.head_branch || github.ref_name }}" build/runs

      - name: Waveform figures
        uses: actions/download-artifact@v7
        with:
          name: waveform-figures
          path: build/site_src/figures

      - name: Layer table of the PDK revision of the gds run
        if: hashFiles('build/runs/gds/tt_submission/**/pdk.json') != ''
        shell: bash
        run: |
          pdk_json=$(find build/runs/gds/tt_submission -name pdk.json | head -n 1)
          ver=$(jq -r .PDK_VERSION "$pdk_json")
          pdk=$(jq -r .PDK "$pdk_json")
          curl -fsSL -o build/pdk.lyp \
            "https://raw.githubusercontent.com/IHP-GmbH/IHP-Open-PDK/$ver/$pdk/libs.tech/klayout/tech/${pdk#ihp-}.lyp" \
            || echo "::warning title=layer table::not found for $pdk at $ver; default colours"

      - name: Layout render
        if: hashFiles('build/runs/gds/tt_submission/**/*.gds') != ''
        run: python figures/layout.py build/runs/gds/tt_submission build/pdk.lyp build/site_src/figures

      - name: Block diagram
        run: python figures/blocks.py build/site_src/figures/block_diagram.svg

      - name: Results page
        run: python figures/results.py build/runs build/site_src/figures build/site_src/results.md

      - name: Protocol count page
        run: python figures/count_page.py build/runs build/site_src/count.md

      - name: Site source
        run: python figures/site.py build/site_src build/runs/gds/tt_submission build/runs/runs.json

      - name: Build the site
        run: mkdocs build --strict

      - name: Browser simulator (built and checked by the sim job)
        uses: actions/download-artifact@v7
        with:
          name: sim-site
          path: build/site/sim

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: site
    if: github.ref == 'refs/heads/cmos5l'
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Site address
        run: echo "::notice title=site::${{ steps.deployment.outputs.page_url }}"

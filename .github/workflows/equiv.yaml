name: equiv

# Netlist-to-RTL equivalence (C3 WP9, docs/signoff.md): the final netlist of a gds run against the RTL of that run's
# own commit, with eqy (equiv/chip.eqy). Runs after every successful gds run on cmos5l (workflow_run, from the
# default branch), by hand with a gds run id, or on a push of the equivalence files (the run id below).
on:
  push:
    paths:
      - 'equiv/**'
      - '.github/workflows/equiv.yaml'
  workflow_dispatch:
    inputs:
      gds_run_id:
        description: 'run id of the gds workflow run'
        required: false
      guard_ref:
        description: 'guard mode: a commit whose RTL is compared with the RTL of this ref (no netlist)'
        required: false
  workflow_run:
    workflows: [gds]
    types: [completed]
    branches: [cmos5l]

env:
  GDS_RUN_ID: ${{ inputs.gds_run_id || github.event.workflow_run.id || '44557589283' }}

jobs:
  equiv:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && !inputs.guard_ref
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PDK_ROOT: /home/runner/pdk
    steps:
      - uses: actions/checkout@v6
      - name: Commit of the gds run
        shell: bash
        run: |
          sha=$(gh run view $GDS_RUN_ID --json headSha -q .headSha)
          echo "GDS_SHA=$sha" >> $GITHUB_ENV
          echo "::notice title=equiv source::gds run $GDS_RUN_ID, commit $sha"
      - name: RTL of that commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.GDS_SHA }}
          path: rtl
      - name: Final netlist of the gds run
        shell: bash
        run: |
          gh run download $GDS_RUN_ID -n tt_submission -D build/gds
          ls -la build/gds/tt_submission
          echo "PDK=$(jq -r '.PDK' build/gds/tt_submission/pdk.json)" >> $GITHUB_ENV
          echo "PDK_VERSION=$(jq -r '.PDK_VERSION' build/gds/tt_submission/pdk.json)" >> $GITHUB_ENV
      - name: PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}
      - name: OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-14'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Behavioural latch and clock-gate models = PDK cell models (equiv/cells_tb.v)
        shell: bash
        run: |
          set -o pipefail
          v=$PDK_ROOT/$PDK/libs.ref/sg13cmos5l_stdcell/verilog/sg13cmos5l_stdcell.v
          iverilog -g2012 -DFUNCTIONAL -o cells_tb rtl/src/pe_cells.v equiv/cells_tb.v "$v"
          vvp -n cells_tb | tee cells_tb.log
          echo "::notice title=cell models::$(grep '^cells_tb' cells_tb.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          grep -q "cells_tb: PASS" cells_tb.log
      - name: The submitted netlist is the final netlist (nl = pnl without power)
        shell: bash
        run: |
          set +e
          gh run download $GDS_RUN_ID -n GDS_logs -D build/logs
          r=$(ls -d build/logs/runs/*/ 2>/dev/null | head -n 1)
          nl=$(ls ${r}final/nl/*.v | head -n 1)
          pnl=$(ls ${r}final/pnl/*.v | head -n 1)
          sub=$(ls build/gds/tt_submission/*.v | head -n 1)
          out=$(python3 equiv/teeth.py same "$nl" "$pnl" "$sub")
          rc=$?
          echo "$out"
          echo "::notice title=nl = pnl, gds $GDS_RUN_ID::$(echo "$out" | sed ':a;N;$!ba;s/\n/%0A/g')"
          rm -rf build/logs
          exit $rc
      - name: Netlist and configuration
        shell: bash
        run: |
          set -e
          nl=$(ls build/gds/tt_submission/*.v | head -n 1)
          echo "netlist: $nl ($(wc -l < $nl) lines)"
          grep -c "VPWR" "$nl" || true
          files=$(sed -n '/source_files:/,/^[^ ]/p' rtl/info.yaml | grep -o '"[^"]*\.v"' | tr -d '"' | grep -v sram_bb.v | sed 's|^|'$PWD'/rtl/src/|' | tr '\n' ' ')
          echo "RTL files: $files"
          lib=$(ls $PDK_ROOT/$PDK/libs.ref/*_stdcell/lib/*typ*.lib | head -n 1)
          echo "liberty: $lib"
          sed -e "s|@ROOT@|$PWD|g" -e "s|@RTL@|$PWD/rtl|g" -e "s|@RTL_FILES@|$files|" -e "s|@LIB@|$lib|" -e "s|@NL@|$PWD/$nl|" \
              equiv/chip.eqy > run.eqy
          cat run.eqy
      - name: eqy
        shell: bash
        run: |
          set +e
          yosys -V
          eqy -j 4 -f run.eqy -d eqy_work
          rc=$?
          tail -n 40 eqy_work/logfile.txt 2>/dev/null
          summ=$(grep -h -E "PASS|FAIL|ERROR|partitions|Successfully" eqy_work/logfile.txt 2>/dev/null | tail -n 25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=eqy gds $GDS_RUN_ID::${summ}"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: equiv-${{ env.GDS_RUN_ID }}
          path: |
            run.eqy
            eqy_work/logfile.txt
            eqy_work/*.log
          if-no-files-found: warn

  # Six planted netlist faults (equiv/teeth.py): eqy must find each copy not equivalent. A tooth that passes, or that
  # stops with an error instead of a failed partition, fails the job. Runs after the netlist job has passed.
  teeth:
    needs: equiv
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        tooth: [ff_d_swap, cts_inv, hold_inv, cg_gate_swap, lat_d_swap, sync_bypass]
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PDK_ROOT: /home/runner/pdk
    steps:
      - uses: actions/checkout@v6
      - name: Commit of the gds run
        shell: bash
        run: echo "GDS_SHA=$(gh run view $GDS_RUN_ID --json headSha -q .headSha)" >> $GITHUB_ENV
      - name: RTL of that commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.GDS_SHA }}
          path: rtl
      - name: Final netlist and the planted fault
        shell: bash
        run: |
          gh run download $GDS_RUN_ID -n tt_submission -D build/gds
          echo "PDK=$(jq -r '.PDK' build/gds/tt_submission/pdk.json)" >> $GITHUB_ENV
          echo "PDK_VERSION=$(jq -r '.PDK_VERSION' build/gds/tt_submission/pdk.json)" >> $GITHUB_ENV
          nl=$(ls build/gds/tt_submission/*.v | head -n 1)
          out=$(python3 equiv/teeth.py plant "$nl" build/teeth | grep "^${{ matrix.tooth }}:")
          echo "$out"
          echo "::notice title=tooth ${{ matrix.tooth }}::$out"
      - name: PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}
      - name: OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-14'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: eqy on the faulty netlist (must fail)
        shell: bash
        run: |
          set +e
          files=$(sed -n '/source_files:/,/^[^ ]/p' rtl/info.yaml | grep -o '"[^"]*\.v"' | tr -d '"' | grep -v sram_bb.v | sed 's|^|'$PWD'/rtl/src/|' | tr '\n' ' ')
          lib=$(ls $PDK_ROOT/$PDK/libs.ref/*_stdcell/lib/*typ*.lib | head -n 1)
          sed -e "s|@ROOT@|$PWD|g" -e "s|@RTL@|$PWD/rtl|g" -e "s|@RTL_FILES@|$files|" -e "s|@LIB@|$lib|" \
              -e "s|@NL@|$PWD/build/teeth/${{ matrix.tooth }}.v|" equiv/chip.eqy > run.eqy
          eqy -j 4 -f run.eqy -d eqy_work
          rc=$?
          summ=$(grep -h -E "PASS|FAIL|ERROR|partitions|Successfully" eqy_work/logfile.txt 2>/dev/null | tail -n 12 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=eqy tooth ${{ matrix.tooth }} (exit $rc)::${summ}"
          if [ $rc -eq 0 ]; then echo "::error::tooth ${{ matrix.tooth }}: eqy found the faulty netlist equivalent"; exit 1; fi
          if ! grep -q -E "Failed to prove equivalence|FAIL" eqy_work/logfile.txt; then
            echo "::error::tooth ${{ matrix.tooth }}: eqy stopped without a failed partition"; exit 1
          fi
          echo "tooth ${{ matrix.tooth }}: not equivalent, as required"

  # Guard mode (dispatch with guard_ref): the RTL of this ref against the RTL of guard_ref, both read as the netlist
  # job reads the gold side (SYNTHESIS, the same black boxes). Shows that a change is "logic unchanged" where that is
  # its claim. A planted RTL change (one helper reset constant) must make it fail.
  guard:
    if: inputs.guard_ref
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        case: [guard, planted]
    steps:
      - uses: actions/checkout@v6
      - name: RTL of the other commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.guard_ref }}
          path: base
      - name: OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-14'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: eqy RTL against RTL
        shell: bash
        run: |
          set +e
          if [ "${{ matrix.case }}" = planted ]; then
            sed -i 's/tx_line <= 1.b1; tx_sck <= 1.b0;/tx_line <= 1'"'"'b0; tx_sck <= 1'"'"'b0;/' src/pe_slu.v
            git diff --stat src/
          fi
          list() { sed -n '/source_files:/,/^[^ ]/p' $1/info.yaml | grep -o '"[^"]*\.v"' | tr -d '"' | grep -v sram_bb.v | sed 's|^|'$PWD/$1'/src/|' | tr '\n' ' '; }
          gold=$(list base); gate=$(list .)
          sed -e "s|@ROOT@|$PWD|g" -e "s|@GOLD@|$PWD/base|g" -e "s|@GATE@|$PWD|g" -e "s|@GOLD_FILES@|$gold|" -e "s|@GATE_FILES@|$gate|" \
              equiv/guard.eqy > run.eqy
          eqy -j 4 -f run.eqy -d eqy_work
          rc=$?
          summ=$(grep -h -E "PASS|FAIL|ERROR|partitions|Successfully" eqy_work/logfile.txt 2>/dev/null | tail -n 12 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=guard ${{ matrix.case }} against ${{ inputs.guard_ref }} (exit $rc)::${summ}"
          if [ "${{ matrix.case }}" = planted ]; then
            [ $rc -ne 0 ] && grep -q -E "Failed to prove equivalence|FAIL" eqy_work/logfile.txt || { echo "::error::planted guard change not found"; exit 1; }
          else
            exit $rc
          fi

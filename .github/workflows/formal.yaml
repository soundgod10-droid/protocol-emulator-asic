name: formal

# Every proof job of formal/ and the structural CDC check, on every push that changes src/ or formal/ (docs/verification.md section 3).
# A job passes when SymbiYosys returns 0: PASS for the proofs, bmc and structure jobs, all covers reached
# for the cover jobs, and the expected counterexample for the checks of the checks (host_port_mut_id.sby,
# iso_mut_io.sby and the 13 tasks of slu_teeth.sby, "expect fail"). A changed RTL that breaks a property, removes properties (select -assert-min) or
# bypasses a synchronizer (cdc.sby) fails its job.

# It runs when a push changes the RTL, the proof files or this workflow; the proofs read nothing else.
on:
  push:
    paths:
      - 'src/**'
      - 'formal/**'
      - '.github/workflows/formal.yaml'
  workflow_dispatch:

# On cmos5l and tags every run is kept; on other branches a newer push cancels the older run.
concurrency:
  group: ${{ (github.ref == 'refs/heads/cmos5l' || startsWith(github.ref, 'refs/tags/')) && format('formal-run-{0}', github.run_id) || format('formal-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: [core, core_cover, timed_out, timed_out_cover, host_port, host_port_cover, host_port_mut_id,
              mem, mem_small, mem_cover, mem_reset, mem_full, mem_full_reset, sram, sram_cover, cdc,
              proc, proc_if, proc_cover, slu_usb, slu_eth, slu_cover_usb, slu_cover_eth, slu_teeth,
              iso, iso_cover, iso_mut_io]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Yosys, SymbiYosys and Z3 (OSS CAD Suite)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-14'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run formal/${{ matrix.job }}.sby
        shell: bash
        run: |
          cd formal
          yosys -V
          sby -f ${{ matrix.job }}.sby

      - name: Result
        if: always()
        shell: bash
        run: |
          # A job with tasks (slu_teeth.sby) writes one folder per task: <job>_<task>.
          found=0
          for log in formal/${{ matrix.job }}/logfile.txt formal/${{ matrix.job }}_*/logfile.txt; do
            [ -f "$log" ] || continue
            found=1
            dir=$(basename "$(dirname "$log")")
            status=$(grep -h "summary: Elapsed\|DONE (" "$log" | tail -n 2 | tr '\n' ' ')
            echo "::notice title=formal $dir::$status"
            { echo "### formal/$dir"; echo '```'; grep -h "summary:" "$log"; tail -n 3 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" = 0 ]; then
            echo "::error title=formal ${{ matrix.job }}::no logfile.txt"
          fi

      - name: Upload the job folder
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-${{ matrix.job }}
          path: |
            formal/${{ matrix.job }}/logfile.txt
            formal/${{ matrix.job }}/status
            formal/${{ matrix.job }}/engine_*/trace*.vcd
            formal/${{ matrix.job }}_*/logfile.txt
            formal/${{ matrix.job }}_*/status
            formal/${{ matrix.job }}_*/engine_*/trace*.vcd
          if-no-files-found: warn

name: fpga

# FPGA build of the chip RTL for the bench (docs/bench.md): the file set of fpga/files.f (the latch memory as an
# FPGA memory, the SRAM macros as block RAM, no IHP cells), synthesis per family with a clock-network check, place
# and route with 5 seeds per target and the post-route fmax of each, and the RTL test suite with the FPGA file set.
# Gate G1: the worst of the 5 seeds reaches 63 MHz (60 MHz + 5 %) with 0 flip-flops on a derived clock, on at least
# one family that fits. nextpnr timing models are not vendor sign-off.
on:
  push:
    paths:
      - 'src/**'
      - 'fpga/**'
      - '.github/workflows/fpga.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ (github.ref == 'refs/heads/cmos5l' || startsWith(github.ref, 'refs/tags/')) && format('fpga-run-{0}', github.run_id) || format('fpga-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  synth:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The bench family (ECP5), GW2A and the iCE40 "does not fit" record. The W5 variants (ecp5r ABC9 with
        # flip-flop retiming, ecp5n without wide-LUT muxes, nexus, gw5a) and the path-ladder diagnoses (ecp5x, ecp5c:
        # helpers removed from pe_proc) keep their case lines below for a run by hand; G1 was not met with any of them
        # (best worst-seed 39.28 MHz), and the bench runs at 25 MHz on ECP5 speed 6.
        family: [ecp5, gw2a, ice40]
    steps:
      - uses: actions/checkout@v6
      - name: OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-14'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Synthesis (${{ matrix.family }})
        shell: bash
        run: |
          yosys -V
          # the fmax harness top (three pins) around the chip; fpga_top.v is the bench top of the same file set
          files="$(grep -v '^#' fpga/files.f | tr '\n' ' ') fpga/fpga_fmax_top.v"
          case "${{ matrix.family }}" in
            ecp5)  cmd="synth_ecp5 -top fpga_fmax_top" ;;
            ecp5r) cmd="synth_ecp5 -abc9 -dff -top fpga_fmax_top" ;;
            ecp5n) cmd="synth_ecp5 -abc9 -nowidelut -top fpga_fmax_top" ;;
            ecp5x) cmd="hierarchy -top fpga_fmax_top; delete pe_proc/u_eth; synth_ecp5 -top fpga_fmax_top" ;;
            ecp5c) cmd="hierarchy -top fpga_fmax_top; delete pe_proc/u_eth pe_proc/u_usb; synth_ecp5 -top fpga_fmax_top" ;;
            nexus) cmd="synth_nexus -top fpga_fmax_top" ;;
            gw2a)  cmd="synth_gowin -family gw2a -top fpga_fmax_top" ;;
            gw5a)  cmd="synth_gowin -family gw5a -nolutram -top fpga_fmax_top" ;;
            ice40) cmd="synth_ice40 -top fpga_fmax_top" ;;
          esac
          yosys -q -l synth_${{ matrix.family }}.log -p "read_verilog $files; $cmd; tee -o stat_${{ matrix.family }}.txt stat; write_json fpga_${{ matrix.family }}.json" || {
            echo "::notice title=fpga synth error ${{ matrix.family }}::$(grep -E 'ERROR' synth_${{ matrix.family }}.log | head -n 3 | cut -c1-400)"
            exit 1
          }
          tail -n 60 stat_${{ matrix.family }}.txt
      - name: Clock network (0 flip-flops on a derived clock)
        shell: bash
        run: |
          set +e
          python3 fpga/clock_check.py fpga_${{ matrix.family }}.json fpga_fmax_top clk | tee clock_${{ matrix.family }}.txt
          rc=${PIPESTATUS[0]}
          echo "::notice title=fpga clock ${{ matrix.family }}::$(tail -n 1 clock_${{ matrix.family }}.txt)"
          echo "::notice title=fpga cells ${{ matrix.family }}::$(sed -n 2p clock_${{ matrix.family }}.txt | cut -c1-900)"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synth-${{ matrix.family }}
          path: |
            fpga_${{ matrix.family }}.json
            stat_${{ matrix.family }}.txt
            clock_${{ matrix.family }}.txt
            synth_${{ matrix.family }}.log

  pnr:
    needs: synth
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # iCE40UP5K: synthesis only; it does not fit (8,014 of 5,280 logic cells, run 44768229505)
        # W5: ecp5n_25k_8 adds the timing-driven router rip-up; nexus40_9 is the LIFCL-40 at speed grade 9
        # ecp5_12k_6, ecp5_85k_6: the two ULX3S variants on sale (LFE5U-12F-6BG381C, LFE5U-85F-6BG381C; the shop no
        # longer lists the 25F)
        target: [ecp5_25k_6, ecp5_25k_8, ecp5_12k_6, ecp5_85k_6, gw2a_18c]
    steps:
      - uses: actions/checkout@v6
      - name: OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-14'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Netlist
        uses: actions/download-artifact@v7
        with:
          pattern: synth-*
          merge-multiple: true
      - name: Place and route, seeds 1 to 5
        shell: bash
        run: |
          set +e
          t=${{ matrix.target }}
          for s in 1 2 3 4 5; do
            case "$t" in
              ecp5_25k_6) nextpnr-ecp5 --25k --package CABGA381 --speed 6 --json fpga_ecp5.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              ecp5_25k_8) nextpnr-ecp5 --25k --package CABGA381 --speed 8 --json fpga_ecp5.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              ecp5_12k_6) nextpnr-ecp5 --12k --package CABGA381 --speed 6 --json fpga_ecp5.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              ecp5_85k_6) nextpnr-ecp5 --85k --package CABGA381 --speed 6 --json fpga_ecp5.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              ecp5r_25k_8) nextpnr-ecp5 --25k --package CABGA381 --speed 8 --json fpga_ecp5r.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              ecp5n_25k_8) nextpnr-ecp5 --25k --package CABGA381 --speed 8 --json fpga_ecp5n.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --tmg-ripup --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              ecp5x_25k_8) nextpnr-ecp5 --25k --package CABGA381 --speed 8 --json fpga_ecp5x.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              ecp5c_25k_8) nextpnr-ecp5 --25k --package CABGA381 --speed 8 --json fpga_ecp5c.json --lpf fpga/ulx3s.lpf --lpf-allow-unconstrained --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              nexus40_9)  nextpnr-nexus --device LIFCL-40-9BG400C --json fpga_nexus.json --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              gw2a_18c)   nextpnr-himbaechel --device GW2AR-LV18QN88C8/I7 --vopt family=GW2A-18C --vopt cst=fpga/tangnano20k_fmax.cst --json fpga_gw2a.json --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
              gw5a_25a)   nextpnr-himbaechel --device GW5A-LV25MG121NES --vopt family=GW5A-25A --vopt cst=fpga/primer25k_fmax.cst --json fpga_gw5a.json --freq 63 --seed $s --timing-allow-fail --report rep_${t}_$s.json -l pnr_${t}_$s.log ;;
            esac
            echo "seed $s: nextpnr exit $?"
            grep -E "Max frequency|ERROR" pnr_${t}_$s.log | tail -n 3
          done
          python3 fpga/fmax.py $t 63 rep_${t}_1.json rep_${t}_2.json rep_${t}_3.json rep_${t}_4.json rep_${t}_5.json | tee fmax_$t.txt
          echo "::notice title=fpga fmax $t::$(head -n 1 fmax_$t.txt)%0A$(tail -n +2 fmax_$t.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          # nextpnr errors of a seed without a report (the job log needs a sign-in to read)
          err=$(grep -h -E "ERROR|error:" pnr_${t}_*.log 2>/dev/null | sort | uniq -c | head -n 6 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$err" ] && echo "::notice title=fpga pnr errors $t::$err"
          true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnr-${{ matrix.target }}
          path: |
            rep_*.json
            pnr_*.log
            fmax_*.txt

  # C4 W5: Artix-7 35T (xc7a35tcsg324-1, as on the Arty A7-35T) with the openXC7 flow (Yosys synth_xilinx, nextpnr-xilinx
  # with the Project X-Ray database), 5 seeds, the same fmax harness and gate. Timing comes from the X-Ray timing database,
  # not from the vendor's sign-off.
  xc7:
    # by hand only (worst seed 37.17 MHz, run 44808418108); the nix toolchain build is the longest job of the workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Synthesis and place and route, seeds 1 to 5
        shell: bash
        run: |
          set +e
          cat > xc7.sh <<'EOF'
          echo "NEXTPNR_XILINX_DIR=$NEXTPNR_XILINX_DIR PRJXRAY_DB_DIR=$PRJXRAY_DB_DIR ARTIX7_CHIPDB=$ARTIX7_CHIPDB"
          yosys -V
          files="$(grep -v '^#' fpga/files.f | tr '\n' ' ') fpga/fpga_fmax_top.v"
          yosys -q -l synth_xc7.log -p "read_verilog $files; synth_xilinx -flatten -abc9 -arch xc7 -top fpga_fmax_top; tee -o stat_xc7.txt stat; write_json fpga_xc7.json"
          python3 fpga/clock_check.py fpga_xc7.json fpga_fmax_top clk | tee clock_xc7.txt
          db="$ARTIX7_CHIPDB/xc7a35tcsg324.bin"
          if [ ! -f "$db" ]; then
            gen=$NEXTPNR_XILINX_DIR/share/nextpnr/himbaechel/uarch/xilinx/gen/xilinx_gen.py
            python3 $gen --xray $PRJXRAY_DB_DIR/artix7 --device xc7a50t --bba xc7a35tcsg324.bba
            bbasm -l xc7a35tcsg324.bba xc7a35tcsg324.bin
            db=xc7a35tcsg324.bin
          fi
          echo "chip database: $db"
          for s in 1 2 3 4 5; do
            nextpnr-xilinx --chipdb $db --xdc fpga/arty_a7_fmax.xdc --json fpga_xc7.json --freq 63 --seed $s \
              --timing-allow-fail --report rep_xc7a35t_1_$s.json -l pnr_xc7a35t_1_$s.log
            echo "seed $s: nextpnr exit $?"
            grep -E "Max frequency|ERROR" pnr_xc7a35t_1_$s.log | tail -n 3
          done
          EOF
          nix develop github:openxc7/toolchain-nix --command bash xc7.sh
          echo "::notice title=fpga clock xc7::$(tail -n 1 clock_xc7.txt)"
          python3 fpga/fmax.py xc7a35t_1 63 rep_xc7a35t_1_1.json rep_xc7a35t_1_2.json rep_xc7a35t_1_3.json rep_xc7a35t_1_4.json rep_xc7a35t_1_5.json | tee fmax_xc7a35t_1.txt
          echo "::notice title=fpga fmax xc7a35t_1::$(head -n 1 fmax_xc7a35t_1.txt)%0A$(tail -n +2 fmax_xc7a35t_1.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnr-xc7a35t_1
          path: |
            stat_xc7.txt
            clock_xc7.txt
            synth_xc7.log
            rep_*.json
            pnr_*.log
            fmax_*.txt

  # C4 W6: the protocol tests on the bench family's mapped netlist: Yosys synth_ecp5 of the chip top with the FPGA file
  # set, written as Verilog, simulated with Yosys's own ECP5 cell models (cells_sim.v) as a gate-level run (GATES=yes:
  # pins only, no RTL names). Logic simulation at zero delay: it shows that the FPGA synthesis keeps the behaviour the
  # RTL tests check (the same tests pass on the RTL and on the IHP netlist), not the FPGA's timing.
  postsynth:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: [fw1, fw2, slu, usb, eth]
    steps:
      - uses: actions/checkout@v6
      - name: OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-14'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python packages
        run: pip install -r test/requirements.txt
      - name: Mapped netlist (synth_ecp5, chip top)
        shell: bash
        run: |
          files="$(grep -v '^#' fpga/files.f | tr '\n' ' ')"
          yosys -q -l synth_net.log -p "read_verilog $files; synth_ecp5 -top tt_um_soundgod10_droid_protocol_emulator; tee -o stat_net.txt stat; write_verilog -noattr fpga_ecp5_net.v"
          tail -n 30 stat_net.txt
          echo "::notice title=fpga netlist cells::$(grep -E '^ +[0-9]+ +(LUT4|TRELLIS_FF|CCU2C|PFUMX|L6MUX21|DP16KD|TRELLIS_DPR16X4)' stat_net.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Tests on the mapped netlist (${{ matrix.part }})
        shell: bash
        run: |
          dat=$(yosys-config --datdir)
          iverilog -V 2>&1 | head -n 1
          cd test
          rm -f results.xml
          gl_part=
          filter=
          case "${{ matrix.part }}" in
            fw1) mod=test_rtl_fw; gl_part=1 ;;
            fw2) mod=test_rtl_fw; gl_part=2 ;;
            slu) mod=test_slu; gl_part=3 ;;
            usb) mod=test_usb_dev; gl_part=4; filter='^test_usb_dev_enumerate$' ;;
            eth) mod=test_eth_dev; gl_part=5; filter='^test_eth_dev_(tx|rx)$' ;;
          esac
          make GATES=yes GL_PART=$gl_part COCOTB_TEST_FILTER="$filter" SIM_BUILD=sim_build/fpga_net \
            VERILOG_SOURCES="$GITHUB_WORKSPACE/fpga_ecp5_net.v $dat/ecp5/cells_sim.v $PWD/tb.v" \
            COMPILE_ARGS="-DGL_TEST -DSIM -I$dat/ecp5" COCOTB_TEST_MODULES=$mod
          python -m cocotb_tools.check_results results.xml
      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postsynth-${{ matrix.part }}
          path: |
            test/results.xml
            stat_net.txt
            synth_net.log

  # C4 W3: the RTL test suite with the FPGA file set (latch memory model of fpga/pe_latch_ram_fpga.v, no src/pe_cells.v).
  rtl_fpga_files:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python packages
        run: pip install -r test/requirements.txt
      - name: RTL tests with the FPGA file set
        run: |
          cd test
          make clean
          make SIM_BUILD=sim_build/fpga PROJECT_SOURCES="project.v pe_sync.v pe_cycle_counter.v pe_timed_out.v pe_sram.v pe_host_fifo.v pe_timed_in.v pe_config.v pe_host_port.v pe_core.v pe_proc.v pe_slu_loop.v pe_slu.v sram_sim.v ../fpga/pe_latch_ram_fpga.v"
          python -m cocotb_tools.check_results results.xml
      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rtl-fpga-files-results
          path: test/results.xml

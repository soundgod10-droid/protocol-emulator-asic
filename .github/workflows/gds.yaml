name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

      # Signoff STA at all corners, fanout violators and key metrics in the run summary and as
      # annotations (the flow fails only on typical-corner timing; docs/signoff.md).
      - name: Signoff facts
        if: always()
        continue-on-error: true
        shell: bash
        run: python .github/signoff_facts.py . "gds"

      # Start and end points of the slow-corner paths with their slack, the first full path, and the
      # disconnected-pin report, as annotations, so that the timing review needs no log artifact (docs/signoff.md).
      - name: Path facts
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          r=$(ls -d runs/*/ | head -n 1)
          f=$(ls ${r}*-openroad-stapostpnr/nom_slow_1p08V_125C/checks.rpt 2>/dev/null | head -n 1)
          if [ -n "$f" ]; then
            body=$(grep -E "^Startpoint|^Endpoint|slack \(" "$f" | head -n 75 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=slow paths::${body}"
            body=$(awk '/^Startpoint/{n++} n==1' "$f" | head -n 110 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=slow worst path::${body}"
          fi
          body=$(grep -rh -i -B2 -A8 "disconnected" ${r}*-checker-disconnectedpins/*.log ${r}*-odb-checkdisconnectedpins/*.log ${r}*disconnected*/*.rpt 2>/dev/null | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=disconnected pins::${body}"
          # Research branch: more slow-corner setup paths, fast-corner hold paths, and the cells on the core's
          # register select sa (its hold buffer is on the worst setup path).
          d=$(ls -d ${r}*-openroad-stapostpnr 2>/dev/null | head -n 1)
          ls ${d}/nom_slow_1p08V_125C/ ${d}/nom_fast_1p32V_m40C/ 2>/dev/null | head -n 40 | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::notice title=sta files::{}"
          for f in ${d}/nom_slow_1p08V_125C/max.rpt; do
            body=$(grep -E "^Startpoint|^Endpoint|slack \(" "$f" 2>/dev/null | head -n 150 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=slow max paths::${body}"
          done
          for f in ${d}/nom_fast_1p32V_m40C/min.rpt; do
            body=$(grep -E "^Startpoint|^Endpoint|slack \(" "$f" 2>/dev/null | head -n 150 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=fast min paths::${body}"
          done
          nl=$(ls ${r}final/nl/*.nl.v 2>/dev/null | head -n 1)
          body=$(grep -n -B3 -E "u_core\.sa\[" "$nl" 2>/dev/null | head -n 80 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=sa nets::${body}"
          true

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  # The protocol tests (test/test_rtl_fw.py) on the gate-level netlist of this run, in two parts (GL_PARTS in that
  # file), and the line-helper chip tests (test/test_slu.py, part 3; its unit tests skip at gate level), in parallel
  # with gl_test and precheck, so that they do not make the run longer. Set up as the gl_test action of
  # tt-gds-action@ttihp27a does (netlist and PDK revision from tt_submission, Icarus 13, -DFUNCTIONAL).
  gl_protocols:
    needs: gds
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: netlist of this run
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: PDK name and version
        run: |
          echo "PDK=$(jq -r '.PDK' tt_submission/pdk.json)" >> $GITHUB_ENV
          echo "PDK_VERSION=$(jq -r '.PDK_VERSION' tt_submission/pdk.json)" >> $GITHUB_ENV

      - name: Install the PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: tools
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb
          pip install -r test/requirements.txt

      - name: protocol tests at gate level, part ${{ matrix.part }}
        shell: bash
        run: |
          cp tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f tb.fst results.xml
          make clean
          if [ "${{ matrix.part }}" = "3" ]; then mod=test_slu; else mod=test_rtl_fw; fi
          GATES=yes GL_PART=${{ matrix.part }} make COCOTB_TEST_MODULES=$mod
          # make returns success even if tests fail, so check results.xml.
          python -m cocotb_tools.check_results results.xml

      - name: results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gl_protocols_${{ matrix.part }}
          path: test/results.xml

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: test/results.xml

  # No viewer job here: the template's viewer job deploys GitHub Pages with only the 3D-viewer page, and a repository
  # has one Pages site, so it would replace the documentation site. The docs workflow deploys the site and puts the
  # layout file of the newest gds run under viewer/ for the same 3D viewer (.github/workflows/docs.yaml).

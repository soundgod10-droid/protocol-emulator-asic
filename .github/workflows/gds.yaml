name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

      # Signoff STA at all corners, fanout violators and key metrics in the run summary and as
      # annotations (the flow fails only on typical-corner timing; docs/signoff.md).
      - name: Signoff facts
        if: always()
        continue-on-error: true
        shell: bash
        run: python .github/signoff_facts.py . "gds"

      # SRAM smoke runs: the max-slew, max-cap and fanout violators and the Magic DRC count as
      # annotations (the run artifacts are too large to fetch for this check).
      - name: Smoke facts
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          r=$(ls -d runs/*/ | head -n 1)
          f=$(ls ${r}*-openroad-stapostpnr/nom_slow_1p08V_125C/checks.rpt 2>/dev/null | head -n 1)
          if [ -n "$f" ]; then
            body=$(sed -n '/report_check_types/,$p' "$f" | grep -v '^$' | head -n 70 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=slow corner violators::${body}"
          fi
          m=$(ls ${r}*-magic-drc/reports/drc.magic.rpt 2>/dev/null | head -n 1)
          if [ -n "$m" ]; then
            body=$(head -n 40 "$m" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=magic drc::${body}"
          fi
          d=$(ls ${r}*-magic-drc/*.log 2>/dev/null | head -n 1)
          [ -n "$d" ] && echo "::notice title=magic drc log::$(grep -iE 'error|COUNT' "$d" | tail -n 10 | sed ':a;N;$!ba;s/\n/%0A/g')"
          # Supply ports of the tile LEF (the layout precheck wants each rectangle within 10 um of the
          # top and bottom edges) and the die area.
          l=$(ls ${r}final/lef/*.lef 2>/dev/null | head -n 1)
          if [ -n "$l" ]; then
            for p in VGND VDPWR; do
              body=$(awk "/PIN $p/,/END $p/" "$l" | grep -E 'LAYER|RECT' | head -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::notice title=lef port $p::${body}"
            done
          fi
          df=$(ls ${r}final/def/*.def 2>/dev/null | head -n 1)
          if [ -n "$df" ]; then
            body=$( (grep -m1 DIEAREA "$df"; awk '/^PINS/,/^END PINS/' "$df" | grep -A4 -E 'VGND|VDPWR' | head -n 60) | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=def die and supply pins::${body}"
          fi
          true

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  # The protocol tests (test/test_rtl_fw.py) on the gate-level netlist of this run, in two parts (GL_PARTS in that
  # file) in parallel with gl_test and precheck, so that they do not make the run longer. Set up as the gl_test
  # action of tt-gds-action@ttihp27a does (netlist and PDK revision from tt_submission, Icarus 13, -DFUNCTIONAL).
  gl_protocols:
    needs: gds
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: netlist of this run
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: PDK name and version
        run: |
          echo "PDK=$(jq -r '.PDK' tt_submission/pdk.json)" >> $GITHUB_ENV
          echo "PDK_VERSION=$(jq -r '.PDK_VERSION' tt_submission/pdk.json)" >> $GITHUB_ENV

      - name: Install the PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: tools
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb
          pip install -r test/requirements.txt

      - name: protocol tests at gate level, part ${{ matrix.part }}
        shell: bash
        run: |
          cp tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f tb.fst results.xml
          make clean
          GATES=yes GL_PART=${{ matrix.part }} make COCOTB_TEST_MODULES=test_rtl_fw
          # make returns success even if tests fail, so check results.xml.
          python -m cocotb_tools.check_results results.xml

      - name: results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gl_protocols_${{ matrix.part }}
          path: test/results.xml

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: test/results.xml

  # No viewer job here: the template's viewer job deploys GitHub Pages with only the 3D-viewer page, and a repository
  # has one Pages site, so it would replace the documentation site. The docs workflow deploys the site and puts the
  # layout file of the newest gds run under viewer/ for the same 3D viewer (.github/workflows/docs.yaml).

name: report
# Research branch only: signoff facts of finished layout runs, read from their GDS_logs
# artifacts on the runner and given as annotations and in the run summary.
on:
  push:
    branches: [m3c-reports]
permissions:
  actions: read
  contents: read
jobs:
  signoff:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - run_id: 43698825176
            cell: 'g_word[108].u_cg.u_cell'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download GDS_logs of the run
        uses: actions/download-artifact@v4
        with:
          name: GDS_logs
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: logs

      - name: Signoff facts
        shell: bash
        run: python .github/signoff_facts.py logs "run ${{ matrix.run_id }}"

      - name: Clock-gate cell through the steps
        if: always()
        shell: bash
        run: python .github/trace_cell.py logs "run ${{ matrix.run_id }}" '${{ matrix.cell }}'

      - name: Fanout of the placement buffers through the steps
        if: always()
        shell: bash
        run: python .github/trace_net.py logs "run ${{ matrix.run_id }}" place3079 X place3115 X place3119 X place3085 X

      - name: Netlist changes of steps 36 to 43
        if: always()
        shell: bash
        run: |
          for d in logs/runs/wokwi/3[6-9]-* logs/runs/wokwi/4[0-3]-*; do
            [ -d "$d" ] || continue
            msg=$(cat "$d"/*.log 2>/dev/null | grep -iE 'insert|remov|clone|resiz|buffer|repair|diode|fanout|swap' | grep -v -i 'warning ord-0039' | sort | uniq -c | sort -rn | head -n 25)
            echo "::notice title=run ${{ matrix.run_id }} $(basename "$d")::$(printf '%s\n' "${msg:-no matching lines}" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          done

      - name: Clock tree synthesis warnings
        if: always()
        shell: bash
        run: |
          msg=$(grep -h -E 'WARNING|ERROR|CTS-[0-9]+' logs/runs/wokwi/*-openroad-cts/*.log | sort | uniq -c | sort -rn | head -n 40)
          echo "::notice title=run ${{ matrix.run_id }} CTS warnings::$(printf '%s\n' "${msg:-none}" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"

  coverage:
    runs-on: ubuntu-24.04
    env:
      RUN_ID: 43693782568
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download coverage of the run
        uses: actions/download-artifact@v4
        with:
          name: coverage
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: cov

      - name: Coverage summary
        run: python .github/coverage_facts.py cov "run $RUN_ID" summary

      - name: Lines not hit, core and host port
        run: python .github/coverage_facts.py cov "run $RUN_ID" pe_core.v pe_host_port.v pe_timed_in.v pe_timed_out.v

      - name: Lines not hit, other blocks
        run: python .github/coverage_facts.py cov "run $RUN_ID" pe_proc.v project.v pe_config.v pe_host_fifo.v pe_cycle_counter.v pe_sync.v pe_latch_ram.v pe_cells.v

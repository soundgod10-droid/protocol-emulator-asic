name: sdf

# Gate-level tests at 60 MHz with the SDF delays of a finished gds run, at each STA corner, with no new gds run.
# Icarus Verilog applies the cell delays; it does not run the timing checks of the cell models, so the signoff STA
# stays the setup and hold check. Wire delays are not loaded (vvp stops on the INTERCONNECT lines). The SRAM macro
# read delay comes from the macro IOPATH entries of the same SDF (largest value, test/sdf_names.py --macro-vh) and is
# applied by the macro models of test/sram_sdf.v.
#
# Parts at each corner (groups of the protocol tests by their measured gate-level times):
#   main     test_r3_sdf (host port read-back through both macros), test.py, test_core
#   counter  test.py test_counter_sequence (256 back-to-back frames)
#   p1, p2   test_rtl_fw parts 1 and 2 (GL_PART)            p3   test_slu (line-helper chip tests)
#   p3u      test_usb_dev enumerate, errors, hid           p4   test_usb_dev drift     p5   test_usb_dev suspend
#   p6       test_eth_dev rx, tx, collision                p7   test_eth_dev link      p8   test_eth_dev nlp_period
# Controls and shmoo, slow corner only:
#   macro_control    macro read delay x 3 (beyond one clock period): test_core_alu_flags must fail (lockstep with
#                    the model; every instruction fetch uses the program macro's data at the next clock edge;
#                    test_r3_sdf cannot see it, the host port reads the data many cycles later)
#   nodelay_control  the gate-level netlist with no SDF: test_r3_sdf must fail (it needs a clock-to-MISO delay)
#   shmoo            test_r3_sdf and test_core_alu_flags at clock periods from 16.666 ns down to 6 ns: pass or fail at
#                    each period (a failure is run again without SDF)
#   p3_overclock     the helper chip tests of SPI flash, JTAG IDCODE, UART RX and UART TX (15 MHz, 15 Mbaud) at clock
#                    periods from 16.666 ns down to 5 ns; a failure is run again without SDF. The control passes when
#                    each test passes at 60 MHz and fails with SDF at a period where it passes without SDF. The bench
#                    keeps the device times of the data sheets and uses the fast pads with no board multiplexer
#                    (SDF_OVERCLOCK in test/test_slu.py), so that a failure comes from the chip's own delays
#
# It runs by hand (Actions > sdf > Run workflow) with the id of the gds run, and after a successful gds run of a
# tape-out tag. A run by hand can take the tests of the branch it runs on (tests: this ref; the src/ difference to the
# commit of the gds run is printed) or of the gds commit (tests: gds commit; the tape-out trigger always does this).

on:
  workflow_dispatch:
    inputs:
      gds_run_id:
        description: "id of the gds workflow run whose netlist and SDF files are checked"
        required: true
      tests:
        description: "tests of: this ref (src/ difference to the gds commit printed), or gds commit"
        required: false
        default: "this ref"
      parts:
        description: "JSON list of the parts run at each corner (default: all eleven)"
        required: false
        default: '["main","counter","p1","p2","p3","p3u","p4","p5","p6","p7","p8"]'
      extra:
        description: "JSON list of the slow-corner controls and shmoo (default: all three; [] for none)"
        required: false
        default: '[{"corner":"nom_slow_1p08V_125C","part":"macro_control"},{"corner":"nom_slow_1p08V_125C","part":"nodelay_control"},{"corner":"nom_slow_1p08V_125C","part":"shmoo"},{"corner":"nom_slow_1p08V_125C","part":"p3_overclock"}]'
  workflow_run:
    workflows: [gds]
    types: [completed]

jobs:
  sdf:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'tapeout'))
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        corner: [nom_slow_1p08V_125C, nom_typ_1p20V_25C, nom_fast_1p32V_m40C]
        part: ${{ fromJSON(inputs.parts || '["main","counter","p1","p2","p3","p3u","p4","p5","p6","p7","p8"]') }}
        include: ${{ fromJSON(inputs.extra || '[{"corner":"nom_slow_1p08V_125C","part":"macro_control"},{"corner":"nom_slow_1p08V_125C","part":"nodelay_control"},{"corner":"nom_slow_1p08V_125C","part":"shmoo"},{"corner":"nom_slow_1p08V_125C","part":"p3_overclock"}]') }}
    env:
      PDK_ROOT: /home/runner/pdk
      SDF_DELAYS: 1
      RUN_ID: ${{ inputs.gds_run_id || github.event.workflow_run.id }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: commit of the gds run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          if [ "${{ inputs.tests || 'gds commit' }}" = "this ref" ]; then
            echo "gds run $RUN_ID, commit $SHA; tests of $GITHUB_REF ($(git rev-parse --short HEAD)); corner ${{ matrix.corner }}, part ${{ matrix.part }}" | tee test/sdf_source.log
            diff=$(git diff --stat "$SHA" HEAD -- src/ | tail -n 1)
            echo "src/ difference from the gds commit: ${diff:-none}" | tee -a test/sdf_source.log
          else
            git checkout "$SHA"
            echo "gds run $RUN_ID, commit $SHA (tests of the gds commit), corner ${{ matrix.corner }}, part ${{ matrix.part }}" | tee test/sdf_source.log
          fi

      - name: netlist and SDF of the gds run
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: gds_logs
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The PDK revision that the gds run used (tt_submission/pdk.json), installed as the gate-level test action does.
      - name: PDK revision of the gds run
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: tt_sub
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: PDK name and version
        run: |
          echo "PDK=$(jq -r '.PDK' tt_sub/tt_submission/pdk.json)" >> $GITHUB_ENV
          echo "PDK_VERSION=$(jq -r '.PDK_VERSION' tt_sub/tt_submission/pdk.json)" >> $GITHUB_ENV
          cat tt_sub/tt_submission/pdk.json | tee -a test/sdf_source.log

      - name: Install the PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: tools
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb
          pip install -r test/requirements.txt

      - name: run tests
        shell: bash
        run: |
          set -o pipefail
          # Icarus drops "ifnone" edge paths ("sorry: ifnone with an edge-sensitive path is not supported"), so
          # the flip-flops would have no clock-to-Q path and vvp stops in vpi_scan when the SDF names it.
          sed -i -E 's/\bifnone[[:space:]]+//' "$PDK_ROOT/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/sg13cmos5l_stdcell.v"
          cp gds_logs/runs/wokwi/final/nl/tt_um_soundgod10_droid_protocol_emulator.nl.v test/gate_level_netlist.v
          SDF="$GITHUB_WORKSPACE/gds_logs/runs/wokwi/final/sdf/${{ matrix.corner }}/tt_um_soundgod10_droid_protocol_emulator__${{ matrix.corner }}.sdf"
          cp "$SDF" /tmp/cell_only.sdf
          scale=1
          if [ "${{ matrix.part }}" = macro_control ]; then scale=3; fi
          python test/sdf_names.py test/gate_level_netlist.v /tmp/cell_only.sdf --macro-vh test/sram_delay.vh \
            --macro-scale $scale | tee test/sdf_names.log
          cat test/sram_delay.vh | tee -a test/sdf_names.log
          echo "::notice title=macro read delay ${{ matrix.corner }} ${{ matrix.part }}::$(tail -n 1 test/sdf_names.log)"
          cd test
          head -n 24 /tmp/cell_only.sdf > sdf_head.log
          rm -f results.xml
          sdf=SDF_FILE=/tmp/cell_only.sdf
          run() { GATES=yes "$@" FST= 2>&1 | grep -v "SDF WARNING" | tee -a sdf_run.log || true; }
          case "${{ matrix.part }}" in
            main)    export SDF_SKIP_COUNTER=1; run make $sdf COCOTB_TEST_MODULES=test_r3_sdf,test,test_core ;;
            counter) export COCOTB_TEST_FILTER=test_counter_sequence; run make $sdf COCOTB_TEST_MODULES=test ;;
            p1)      export GL_PART=1; run make $sdf COCOTB_TEST_MODULES=test_rtl_fw ;;
            p2)      export GL_PART=2; run make $sdf COCOTB_TEST_MODULES=test_rtl_fw ;;
            p3)      run make $sdf COCOTB_TEST_MODULES=test_slu ;;
            p3u)     export COCOTB_TEST_FILTER='test_usb_dev_[eh]'; run make $sdf COCOTB_TEST_MODULES=test_usb_dev ;;
            p4)      export COCOTB_TEST_FILTER=test_usb_dev_drift; run make $sdf COCOTB_TEST_MODULES=test_usb_dev ;;
            p5)      export COCOTB_TEST_FILTER=test_usb_dev_suspend; run make $sdf COCOTB_TEST_MODULES=test_usb_dev ;;
            p6)      export COCOTB_TEST_FILTER='test_eth_dev_[rtc]'; run make $sdf COCOTB_TEST_MODULES=test_eth_dev ;;
            p7)      export COCOTB_TEST_FILTER=test_eth_dev_link; run make $sdf COCOTB_TEST_MODULES=test_eth_dev ;;
            p8)      export COCOTB_TEST_FILTER=test_eth_dev_nlp_period; run make $sdf COCOTB_TEST_MODULES=test_eth_dev ;;
            macro_control) export COCOTB_TEST_FILTER=test_core_alu_flags; run make $sdf COCOTB_TEST_MODULES=test_core ;;
            nodelay_control) run make COCOTB_TEST_MODULES=test_r3_sdf ;;
            shmoo)
              # test_r3_sdf reads through the host port and cannot see a late path; test_core_alu_flags (lockstep, an
              # instruction fetch from the macro in every slot) fails when a path it uses is longer than the period. Icarus
              # runs no setup check, so its first failing period lies below the STA minimum period. A failure with SDF
              # is run again without SDF (own build folder) to tell a timing failure from a test-bench limit.
              ok() { [ -f results.xml ] && ! grep -q "<failure" results.xml && echo pass || echo fail; }
              for p in 16666 15000 14000 13000 12000 11000 10000 9000 8000 7000 6000; do
                export CLK_PS=$p
                rm -f results.xml; unset COCOTB_TEST_FILTER; run make $sdf COCOTB_TEST_MODULES=test_r3_sdf
                r1=$(ok); cp results.xml "results_r3_$p.xml" 2>/dev/null || true
                rm -f results.xml; export COCOTB_TEST_FILTER=test_core_alu_flags; run make $sdf COCOTB_TEST_MODULES=test_core
                r2=$(ok); cp results.xml "results_core_$p.xml" 2>/dev/null || true
                r3=""
                if [ "$r2" = fail ]; then
                  rm -f results.xml; GATES=yes make SIM_BUILD=sim_build/gl_nodelay COCOTB_TEST_MODULES=test_core FST= 2>&1 \
                    | grep -v "SDF WARNING" | tee -a sdf_nodelay.log > /dev/null || true
                  r3=", without SDF $(ok)"
                fi
                unset COCOTB_TEST_FILTER
                echo "$p ps ($(python -c "print(round(1e6/$p, 2))") MHz): test_r3_sdf $r1, test_core_alu_flags $r2$r3" | tee -a shmoo.txt
              done
              echo "::notice title=period shmoo ${{ matrix.corner }}::$(sed -e ':a;N;$!ba;s/\n/%0A/g' shmoo.txt)"
              # the job's verdict: both tests pass at the declared 60 MHz
              grep -q "<failure" results_core_16666.xml && echo "test_core_alu_flags fails at 60 MHz" && exit 1
              # the pin delays of the last test_core run (possibly a no-SDF rerun) are not a measurement of this part
              rm -f pin_delays.json
              cp results_r3_16666.xml results.xml ;;
          esac
          # Clock-to-pin delays of the core lockstep tests (part main): pin terms of the firmware timing certificates.
          if [ -f pin_delays.json ]; then
            echo "::notice title=clock-to-pin delays ${{ matrix.corner }} (cell delays; wires and pads not included)::$(python3 -c "import json; d = json.load(open('pin_delays.json')); print('%0A'.join('%s %.3f to %.3f ns (%d changes)' % (k, v[0] / 1000, v[1] / 1000, v[2]) for k, v in d.items()))")"
          fi
          # Annotation errors: 4 is the header count; more means cells without delays.
          if [ "${{ matrix.part }}" != nodelay_control ]; then
            errors=$(grep -c "SDF ERROR" sdf_run.log || true)
            echo "SDF ERROR lines: $errors" | tee -a sdf_names.log
            grep "SDF ERROR" sdf_run.log | sort | uniq -c | head -n 20 || true
            test "$errors" -le $([ "${{ matrix.part }}" = shmoo ] && echo 88 || echo 4)   # shmoo: 22 SDF runs x 4
          fi
          # Names and messages of the failed testcases as an annotation, so a failure can be read without the log.
          if [ -f results.xml ]; then
            failed=$(python3 -c "import xml.etree.ElementTree as E; r = E.parse('results.xml').getroot(); print('%0A'.join(t.get('name') + ': ' + (t.find('failure').get('message') or t.find('failure').get('error_msg') or '')[:300].replace('%', '%25').replace('\n', ' ') for t in r.iter('testcase') if t.find('failure') is not None))")
            if [ -n "$failed" ]; then echo "::warning title=failed tests ${{ matrix.corner }} ${{ matrix.part }}::$failed"; fi
          fi
          test -f results.xml
          case "${{ matrix.part }}" in
            macro_control|nodelay_control)
              # a control passes when the test fails
              grep -q "<failure" results.xml && echo "control ${{ matrix.part }}: the test failed, as required" ;;
            *) ! grep -q "<failure" results.xml ;;
          esac

      - name: results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdf_${{ matrix.corner }}_${{ matrix.part }}
          path: |
            test/results*.xml
            test/sdf_run.log
            test/sdf_names.log
            test/sdf_head.log
            test/sdf_source.log
            test/sram_delay.vh
            test/shmoo.txt
            test/sdf_nodelay.log
            test/pin_delays.json

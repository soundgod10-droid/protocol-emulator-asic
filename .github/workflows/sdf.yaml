name: sdf

# Gate-level tests with the SDF cell delays of a finished gds run, at each STA corner, with no new
# gds run (docs/decisions.md entry 13: 22 of 22 tests passed at slow, typ and fast in research runs
# 41871325339 and 41924796459). Icarus Verilog applies the delays; it does not run the timing
# checks of the cell models, so the signoff STA stays the setup and hold check. Wire delays are
# not loaded (vvp stops on the INTERCONNECT lines; wire delay is about 0.8 % of the worst path,
# a calculation that is not verified in this repository).
#
# It takes about 5 h at the slow corner, so it does not run on a normal push. It runs:
#   - by hand (Actions > sdf > Run workflow) with the id of the gds run to check;
#   - after a gds run of a tape-out tag (a tag whose name starts with "tapeout") ends with success.
# docs/tapeout_checklist.md: run it on the final gds run.

on:
  workflow_dispatch:
    inputs:
      gds_run_id:
        description: "id of the gds workflow run whose netlist and SDF files are checked"
        required: true
  workflow_run:
    workflows: [gds]
    types: [completed]

jobs:
  sdf:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'tapeout'))
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        corner: [nom_slow_1p08V_125C, nom_typ_1p20V_25C, nom_fast_1p32V_m40C]
        # test_counter_sequence alone took 4 h 48 min at the slow corner (17,275 s, run
        # 41871325339); the other tests took up to 1 h 15 min (41871325339, 41924796459).
        # In one job they would pass the 6 h limit of a hosted runner.
        part: [main, counter]
    env:
      PDK_ROOT: /home/runner/pdk
      SDF_DELAYS: 1
      RUN_ID: ${{ inputs.gds_run_id || github.event.workflow_run.id }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: commit of the gds run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tests must be the ones of the commit that the gds run built.
          SHA=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          git checkout "$SHA"
          echo "gds run $RUN_ID, commit $SHA, corner ${{ matrix.corner }}, part ${{ matrix.part }}" | tee test/sdf_source.log

      - name: netlist and SDF of the gds run
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: gds_logs
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The PDK revision that the gds run used (tt_submission/pdk.json), installed the way the
      # gate-level test action of tt-gds-action@ttihp27a installs it.
      - name: PDK revision of the gds run
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: tt_sub
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: PDK name and version
        run: |
          echo "PDK=$(jq -r '.PDK' tt_sub/tt_submission/pdk.json)" >> $GITHUB_ENV
          echo "PDK_VERSION=$(jq -r '.PDK_VERSION' tt_sub/tt_submission/pdk.json)" >> $GITHUB_ENV
          cat tt_sub/tt_submission/pdk.json | tee -a test/sdf_source.log

      - name: Install the PDK
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: tools
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb
          pip install -r test/requirements.txt

      - name: run tests
        shell: bash
        run: |
          # Icarus drops "ifnone" edge paths ("sorry: ifnone with an edge-sensitive path is not supported"), so
          # the flip-flops would have no clock-to-Q path and vvp stops in vpi_scan when the SDF names it.
          sed -i -E 's/\bifnone[[:space:]]+//' "$PDK_ROOT/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/sg13cmos5l_stdcell.v"
          cp gds_logs/runs/wokwi/final/nl/tt_um_soundgod10_droid_protocol_emulator.nl.v test/gate_level_netlist.v
          SDF="$GITHUB_WORKSPACE/gds_logs/runs/wokwi/final/sdf/${{ matrix.corner }}/tt_um_soundgod10_droid_protocol_emulator__${{ matrix.corner }}.sdf"
          cp "$SDF" /tmp/cell_only.sdf
          python test/sdf_names.py test/gate_level_netlist.v /tmp/cell_only.sdf | tee test/sdf_names.log
          cd test
          # The header lines of the SDF file: they give the 4 "SDF ERROR" lines of every research run.
          head -n 24 /tmp/cell_only.sdf > sdf_head.log
          rm -f results.xml
          if [ "${{ matrix.part }}" = main ]; then
            GATES=yes SDF_SKIP_COUNTER=1 make SDF_FILE=/tmp/cell_only.sdf COCOTB_TEST_MODULES=test_r3_sdf,test,test_core FST= 2>&1 | grep -v "SDF WARNING" | tee sdf_run.log || true
          else
            GATES=yes COCOTB_TEST_FILTER=test_counter_sequence make SDF_FILE=/tmp/cell_only.sdf COCOTB_TEST_MODULES=test FST= 2>&1 | grep -v "SDF WARNING" | tee sdf_run.log || true
          fi
          # Annotation errors: 4 is the header count of the research runs; more means cells without delays.
          grep -c "SDF ERROR" sdf_run.log | tee -a sdf_names.log || true
          test -f results.xml
          ! grep -q "<failure" results.xml

      - name: results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdf_${{ matrix.corner }}_${{ matrix.part }}
          path: |
            test/results.xml
            test/sdf_run.log
            test/sdf_names.log
            test/sdf_head.log
            test/sdf_source.log

name: sigrok

# Outside oracle of the protocol tests (flex/PREREG.md section 6, item 3; docs/counting.md): sigrok-cli 0.7.2 with
# libsigrokdecode at the pinned commit 71f4514 (flex/sigrok_build.sh), built once and kept in the cache.

on:
  push:
    paths:
      - 'flex/sigrok*'
      - 'src/**'
      - 'test/**'
      - 'fw/**'
      - 'asm/**'
      - 'model/**'
      - 'sim/tools/trim_vcd.py'
      - '.github/workflows/sigrok.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ (github.ref == 'refs/heads/cmos5l' || startsWith(github.ref, 'refs/tags/')) && format('sigrok-run-{0}', github.run_id) || format('sigrok-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sigrok:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: sigrok-cli with the pinned decoders (cache)
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/sigrok
          key: sigrok-${{ hashFiles('flex/sigrok_build.sh') }}-ubuntu-24.04

      - name: Build sigrok-cli and libsigrokdecode 71f4514
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash flex/sigrok_build.sh "$HOME/sigrok"

      - name: Runtime libraries
        if: steps.cache.outputs.cache-hit == 'true'
        run: sudo apt-get update -y && sudo apt-get install -y libsigrok4 libglib2.0-0t64 libpython3.12t64

      - name: Versions and decoder list
        run: |
          export LD_LIBRARY_PATH="$HOME/sigrok/lib"
          cat "$HOME/sigrok/PINS"
          "$HOME/sigrok/bin/sigrok-cli" -V
          "$HOME/sigrok/bin/sigrok-cli" -L > decoders.txt
          ls "$HOME/sigrok/share/libsigrokdecode/decoders" | grep -v -e '^common$' -e '^__' | wc -l
          sed -n '/Supported protocol decoders/,/Supported output/p' decoders.txt

      - name: Install iverilog
        run: sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      # The scenarios of test/test_sigrok.py on the RTL, with the pin dump of the whole run (test/tb.v PIN_VCD).
      - name: Scenarios on the RTL with the pin dump
        run: |
          cd test
          rm -f pins.vcd results.xml scenario.json
          make PIN_VCD=1 FST= COCOTB_TEST_MODULES=test_sigrok
          # make returns success even if tests fail, so check results.xml
          python -m cocotb_tools.check_results results.xml

      - name: sigrok judge
        env:
          SIGROK_CLI: /home/runner/sigrok/bin/sigrok-cli
        run: |
          export LD_LIBRARY_PATH="$HOME/sigrok/lib"
          python3 -I flex/sigrok_judge.py list decoders.txt test/scenario.json
          python3 -I flex/sigrok_judge.py judge test/scenario.json test/pins.vcd build/sigrok

      - name: Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sigrok
          path: |
            build/sigrok
            test/scenario.json
            test/results.xml
            decoders.txt

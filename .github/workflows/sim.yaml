name: sim

# Browser simulator (sim/): builds the page with the chip files of this commit, records the waveform samples and runs the
# checks of the page. The docs workflow calls this workflow and puts the built page under sim/ of the Pages site; it
# deploys only when every job here has passed (.github/workflows/docs.yaml, the only workflow that deploys Pages). Run by
# hand, it checks without deploying.
#   tests:       the tests that give samples (sim/tools/wave_samples.py) and the newest successful gds run of the branch;
#   samples_rtl: each of those protocol tests of test/test_rtl_fw.py on the RTL with the pin VCD (test/tb.v PIN_VCD),
#                one job per test, kept in the cache while src, test, fw, model and asm do not change;
#   samples_gl:  the same tests on the netlist of that gds run, set up as the gl_protocols job of gds.yaml, kept in the
#                cache per gds run;
#   build:       samples manifest (gate-level dump against RTL dump), page, chip files and pinned third-party files with
#                the size budget L7 (sim/tools/build_site.py), CPython reference hashes of every example (L1, CPython
#                side, sim/tools/fidelity_cpython.py);
#   decoders:    the page decoders against sigrok-cli on every sample (L3, sim/tools/sigrok_compare.py);
#   browser:     the page in the runner's Google Chrome: L1 browser side (every example's trace hash under Pyodide equal
#                to CPython) and the smoke test L5 (sim/tools/page_check.py).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    outputs:
      rtl: ${{ steps.list.outputs.rtl }}
      gl: ${{ steps.list.outputs.gl }}
      gds_id: ${{ steps.gds.outputs.id }}
      gds_sha: ${{ steps.gds.outputs.sha }}
      same_src: ${{ steps.gds.outputs.same_src }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Tests that give samples
        id: list
        run: |
          echo "rtl=$(python3 -I sim/tools/wave_samples.py tests rtl)" >> "$GITHUB_OUTPUT"
          echo "gl=$(python3 -I sim/tools/wave_samples.py tests gl)" >> "$GITHUB_OUTPUT"

      - name: Newest successful gds run of the branch (netlist for the gate-level samples)
        id: gds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eo pipefail
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w gds.yaml -b "${{ github.ref_name }}" -s success -L 1 --json databaseId,headSha)
          id=$(echo "$run" | jq -r '.[0].databaseId // empty')
          sha=$(echo "$run" | jq -r '.[0].headSha // empty')
          same=false
          if [ -n "$sha" ]; then
            git fetch -q --depth=1 origin "$sha"
            if git diff --quiet "$sha" HEAD -- src; then same=true; fi
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "same_src=$same" >> "$GITHUB_OUTPUT"
          echo "::notice title=gate-level samples::netlist of gds run ${id:-none} (commit ${sha:-none}); src equal to this commit: $same"

  samples_rtl:
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.tests.outputs.rtl) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Samples of this RTL and this test
        id: cache
        uses: actions/cache@v5
        with:
          path: build/samples
          key: sim-rtl-${{ matrix.test }}-${{ hashFiles('src/**', 'test/**', 'fw/**', 'model/**', 'asm/**', 'sim/tools/wave_samples.py', 'sim/tools/trim_vcd.py', '.github/workflows/sim.yaml') }}

      - name: Install iverilog
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Protocol test on the RTL with the pin VCD, and its samples
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eo pipefail
          pip install -r test/requirements.txt
          cd test
          rm -f pins.vcd results.xml
          make PIN_VCD=1 FST= COCOTB_TEST_MODULES=test_rtl_fw COCOTB_TEST_FILTER=${{ matrix.test }}
          # make returns success even if the test fails, so check results.xml
          python -m cocotb_tools.check_results results.xml
          cd ..
          sim="Icarus Verilog $(iverilog -V 2>&1 | head -n 1 | sed -e 's/^Icarus Verilog version //' -e 's/ ()$//') + cocotb $(python -c 'import cocotb; print(cocotb.__version__)')"
          python -I sim/tools/wave_samples.py trim rtl ${{ matrix.test }} test/pins.vcd build/samples "$sim" \
            "$(git rev-parse HEAD)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload the samples
        uses: actions/upload-artifact@v7
        with:
          name: sim-samples-rtl-${{ matrix.test }}
          path: build/samples

  samples_gl:
    needs: tests
    if: needs.tests.outputs.gds_id != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.tests.outputs.gl) }}
    env:
      PDK_ROOT: /home/runner/pdk
      GDS_ID: ${{ needs.tests.outputs.gds_id }}
      GDS_SHA: ${{ needs.tests.outputs.gds_sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Samples of this netlist and this test
        id: cache
        uses: actions/cache@v5
        with:
          path: build/samples
          key: sim-gl-${{ matrix.test }}-${{ needs.tests.outputs.gds_id }}-${{ hashFiles('test/**', 'fw/**', 'model/**', 'asm/**', 'sim/tools/wave_samples.py', 'sim/tools/trim_vcd.py', '.github/workflows/sim.yaml') }}

      - name: Netlist of the gds run
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the artifact also holds src/, docs/ and info.yaml of that run: keep it out of the checkout
          gh run download "$GDS_ID" -R "$GITHUB_REPOSITORY" -n tt_submission -D build/gds
          echo "PDK=$(jq -r '.PDK' build/gds/tt_submission/pdk.json)" >> $GITHUB_ENV
          echo "PDK_VERSION=$(jq -r '.PDK_VERSION' build/gds/tt_submission/pdk.json)" >> $GITHUB_ENV

      - name: Install the PDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: TinyTapeout/ciel-action@v1
        with:
          pdk_name: ${{ env.PDK }}
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: ${{ env.PDK_ROOT }}

      - name: Setup python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Protocol test on the netlist with the pin VCD, and its samples
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eo pipefail
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb
          pip install -r test/requirements.txt
          cp build/gds/tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f pins.vcd results.xml
          GATES=yes make PIN_VCD=1 FST= COCOTB_TEST_MODULES=test_rtl_fw COCOTB_TEST_FILTER=${{ matrix.test }}
          python -m cocotb_tools.check_results results.xml
          cd ..
          sim="Icarus Verilog $(iverilog -V 2>&1 | head -n 1 | sed -e 's/^Icarus Verilog version //' -e 's/ ()$//') + cocotb $(python -c 'import cocotb; print(cocotb.__version__)'), -DGL_TEST -DFUNCTIONAL -DSIM, netlist of gds run $GDS_ID (commit ${GDS_SHA:0:10}), cell models $PDK $PDK_VERSION"
          python -I sim/tools/wave_samples.py trim gl ${{ matrix.test }} test/pins.vcd build/samples "$sim" \
            "$GDS_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload the samples
        uses: actions/upload-artifact@v7
        with:
          name: sim-samples-gl-${{ matrix.test }}
          path: build/samples

  build:
    needs: [tests, samples_rtl, samples_gl]
    # The gate-level samples are an extra view; a failure there stays red in this run but does not
    # stop the page, which then shows the RTL samples only (the same as a run with no gds run).
    if: ${{ !cancelled() && needs.samples_rtl.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Gate-level samples missing
        if: needs.samples_gl.result != 'success' && needs.samples_gl.result != 'skipped'
        run: echo "::warning::Gate-level samples failed (result ${{ needs.samples_gl.result }}); the page is built with the RTL samples only."

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Samples
        uses: actions/download-artifact@v7
        with:
          pattern: sim-samples-*
          path: build/sample-parts

      - name: Samples manifest (each gate-level dump against the RTL dump of the same test)
        run: |
          python -I sim/tools/wave_samples.py manifest build/sample-parts build/samples \
            ${{ needs.tests.outputs.same_src == 'true' && '--require-gl-equal' || '' }}

      - name: Third-party files (cache of the npm downloads)
        uses: actions/cache@v5
        with:
          path: build/vendor-cache
          key: sim-vendor-${{ hashFiles('sim/tools/vendor.json') }}

      - name: Build the page (size budget L7)
        env:
          SIM_BRANCH: ${{ github.ref_name }}
        run: python -I sim/tools/build_site.py build/pages/sim build/samples

      - name: CPython reference hashes of every example (L1, CPython side)
        run: python -I -B sim/tools/fidelity_cpython.py build/pages/sim build/pages/sim/check/cpython.json

      - name: Upload the page
        uses: actions/upload-artifact@v7
        with:
          name: sim-site
          path: build/pages/sim

  decoders:
    needs: build
    # explicit: a skipped samples_gl job further up would skip this job under the default condition
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: The page
        uses: actions/download-artifact@v7
        with:
          name: sim-site
          path: build/pages/sim

      - name: Install sigrok-cli
        run: sudo apt-get update && sudo apt-get install -y sigrok-cli

      - name: Page decoders against sigrok-cli on every sample (L3)
        shell: bash
        run: |
          set -eo pipefail
          node --version
          mkdir -p build/wave
          cp -r build/pages/sim/wave/. build/wave/
          echo '{"type": "module"}' > build/wave/package.json
          node sim/tools/decode_dump.mjs build/wave build/pages/sim/wave/samples build/decode.json
          python3 -I sim/tools/sigrok_compare.py build/pages/sim/wave/samples build/decode.json build/sigrok.json

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sim-decoders
          path: |
            build/decode.json
            build/sigrok.json

  browser:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: The page
        uses: actions/download-artifact@v7
        with:
          name: sim-site
          path: build/pages/sim

      - name: The page in the runner's Chrome (L1 browser side, L5 smoke test)
        run: |
          google-chrome --version
          python3 -I sim/tools/page_check.py build/pages build/page-check

      - name: Upload the results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sim-browser
          path: build/page-check

  visitors:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: The page
        uses: actions/download-artifact@v7
        with:
          name: sim-site
          path: build/pages/sim

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Playwright with WebKit and Chromium
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps webkit chromium

      - name: Visitor paths in phone views of WebKit (iPhone 13) and Chromium (Pixel 7) at 390 and 320 px (L5e)
        run: python -I sim/tools/visitor_check.py build/pages build/visitor-check

      - name: Upload the results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sim-visitors
          path: build/visitor-check

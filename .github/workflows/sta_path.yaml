name: sta_path

# Research workflow: the worst flip-flop setup path (start and end cells) of each signoff corner of a
# finished gds run, as annotations, from its GDS_logs artifact. No layout run.

on:
  workflow_dispatch:
    inputs:
      gds_run_id:
        description: "id of the gds workflow run whose signoff STA reports are read"
        required: true

jobs:
  path:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: signoff reports of the gds run
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          path: gds_logs
          run-id: ${{ inputs.gds_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: worst setup paths
        run: python3 .github/sta_path.py gds_logs

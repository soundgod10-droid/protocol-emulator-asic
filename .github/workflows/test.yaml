name: test
on: [push, workflow_dispatch]
# On cmos5l and tags every run is kept; on other branches a newer push cancels the older run.
concurrency:
  group: ${{ (github.ref == 'refs/heads/cmos5l' || startsWith(github.ref, 'refs/tags/')) && format('test-run-{0}', github.run_id) || format('test-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  # Host program (host/pe_host) in CPython against the RTL: ARP + 10 ICMP echoes through fw/eth_10bt.s, 100 keystrokes
  # through fw/usb_dev.s, the PIO SPI program in its interpreter (docs/host_program.md). Own job: about 20 min.
  host:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # test_bench_judges (C4 W8) reads the RTL results that test_host_prog writes to test/output, so it runs second.
      - name: Run the host program tests and the bench judges
        run: |
          cd test
          make clean
          rm -rf output
          make COCOTB_TEST_MODULES=test_host_prog,test_bench_judges
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload the results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-results
          path: |
            test/results.xml
            test/output/usb_enum.json
            test/output/eth_line.pcapng

  # Multiplexer delay sweep of the helper's clocked mode (docs/bench.md section 7): the delay at which each 15 and
  # 30 MHz rate first fails. Own job (about 35 min; JTAG is most of it), RTL only.
  mux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run the multiplexer sweep
        run: |
          cd test
          make clean
          rm -rf output
          make COCOTB_TEST_MODULES=test_mux_sweep
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload the results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: mux-results
          path: |
            test/results.xml
            test/output/test_mux_*.txt

  # Protocol count from these results (docs/counting.md, .github/workflows/count.yaml).
  count:
    needs: test
    if: success() || failure()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/count.yaml
    with:
      test_run_id: ${{ github.run_id }}

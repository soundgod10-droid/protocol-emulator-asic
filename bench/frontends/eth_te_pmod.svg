<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="1200" height="760" fill="white"/>
  <text x="20" y="28" font-size="18" font-weight="bold">10BASE-Te front end (Pmod module, demo board) - bench/frontends/eth_te_pmod.svg</text>
  <text x="20" y="48">Net-labelled schematic. Chip pins (host pin configuration, docs/helpers.md 3): uio0 TXA = TD+ pad 1, uio1 TXB = TD- pad 1, uio2 TXC = TD+ pad 2 (1 clock later),</text>
  <text x="20" y="66">uio3 TXD = TD- pad 2 (1 clock later); ui_in[0] = slicer (SEL DIN), ui_in[1] = squelch (SEL AUX0). SPICE: spice/eth_te_tx_*.sp, spice/eth_te_rx.sp.</text>

  <!-- J1 uio Pmod -->
  <rect x="30" y="110" width="160" height="190" fill="none" stroke="black" stroke-width="2"/>
  <text x="40" y="102" font-weight="bold">J1 Pmod (uio)</text>
  <g font-size="12">
    <text x="40" y="135">1 uio0</text><text x="195" y="135">TXA</text>
    <text x="40" y="160">2 uio1</text><text x="195" y="160">TXB</text>
    <text x="40" y="185">3 uio2</text><text x="195" y="185">TXC</text>
    <text x="40" y="210">4 uio3</text><text x="195" y="210">TXD</text>
    <text x="40" y="235">5, 11 GND</text>
    <text x="40" y="260">6, 12 3V3</text>
    <text x="40" y="285">7-10 n.c.</text>
  </g>
  <!-- J2 ui Pmod -->
  <rect x="30" y="430" width="160" height="140" fill="none" stroke="black" stroke-width="2"/>
  <text x="40" y="422" font-weight="bold">J2 Pmod (ui)</text>
  <g font-size="12">
    <text x="40" y="455">1 ui_in0</text><text x="195" y="455">SLICE</text>
    <text x="40" y="480">2 ui_in1</text><text x="195" y="480">SQUELCH</text>
    <text x="40" y="505">5, 11 GND</text>
    <text x="40" y="530">6, 12 3V3 (supply)</text>
    <text x="40" y="555">others n.c.</text>
  </g>

  <!-- TX network -->
  <text x="290" y="102" font-weight="bold">Transmit network</text>
  <g font-size="12">
    <rect x="300" y="125" width="60" height="16" fill="none" stroke="black"/><text x="260" y="138">TXA</text><text x="370" y="138">R1 69.8R 0.1%</text><text x="470" y="138">TDP</text>
    <rect x="300" y="155" width="60" height="16" fill="none" stroke="black"/><text x="260" y="168">TXC</text><text x="370" y="168">R3 69.8R 0.1%</text><text x="470" y="168">TDP</text>
    <rect x="300" y="185" width="60" height="16" fill="none" stroke="black"/><text x="260" y="198">TXB</text><text x="370" y="198">R2 69.8R 0.1%</text><text x="470" y="198">TDM</text>
    <rect x="300" y="215" width="60" height="16" fill="none" stroke="black"/><text x="260" y="228">TXD</text><text x="370" y="228">R4 69.8R 0.1%</text><text x="470" y="228">TDM</text>
    <text x="300" y="262">20 MHz 3rd-order L-C-L (100 ohm differential):</text>
    <text x="300" y="282">L1 390 nH: TDP to F1P; L2 390 nH: TDM to F1M</text>
    <text x="300" y="302">C1 160 pF C0G: F1P to F1M</text>
    <text x="300" y="322">L3 240 nH: F1P to MTDP; L4 240 nH: F1M to MTDM</text>
    <text x="300" y="342">(L3/L4 = 397.9 nH - half the 0.3 uH leakage, assumed)</text>
  </g>

  <!-- U3 ESD -->
  <rect x="640" y="120" width="170" height="130" fill="#fff6ee" stroke="black" stroke-width="2"/>
  <text x="640" y="112" font-weight="bold">U3 TPD4E05U06DQAR</text>
  <g font-size="12">
    <text x="648" y="145">IO1 MTDP</text><text x="648" y="170">IO2 MTDM</text>
    <text x="648" y="195">IO3 RDP</text><text x="648" y="220">IO4 RDM</text><text x="648" y="242">GND</text>
  </g>

  <!-- J3 HR911105A -->
  <rect x="900" y="110" width="250" height="250" fill="#f4fff4" stroke="black" stroke-width="2"/>
  <text x="900" y="102" font-weight="bold">J3 HR911105A (RJ45 + 1:1 magnetics + LEDs)</text>
  <g font-size="12">
    <text x="908" y="135">TD+  (chip side)</text><text x="860" y="135">MTDP</text>
    <text x="908" y="160">TD-  (chip side)</text><text x="860" y="160">MTDM</text>
    <text x="908" y="185">TCT: 100 nF to GND</text>
    <text x="908" y="215">RD+  (chip side)</text><text x="860" y="215">RDP</text>
    <text x="908" y="240">RD-  (chip side)</text><text x="860" y="240">RDM</text>
    <text x="908" y="265">RCT: n.c.</text>
    <text x="908" y="290">shield: 1 M || 4.7 nF to GND</text>
    <text x="908" y="315">LEDs: n.c. (or to free uo pins)</text>
    <text x="908" y="345">pin numbers: from the drawing on screen</text>
  </g>

  <!-- RX -->
  <text x="290" y="402" font-weight="bold">Receive network</text>
  <g font-size="12">
    <text x="300" y="425">R5 49.9R 1%: RDP to VB; R6 49.9R 1%: RDM to VB (100 ohm termination); C2 10 nF: VB to GND</text>
    <text x="300" y="445">R7 10.0k 0.1%: 3V3 to VB; R8 10.0k 0.1%: VB to GND; C3 100 nF: VB to GND  (VB = 1.65 V)</text>
    <text x="300" y="465">R9 7.87k 0.1%: 3V3 to VREF; R10 10.0k 0.1%: VREF to GND; C4 100 nF  (VREF = 1.847 V = VB + 197 mV)</text>
  </g>
  <rect x="380" y="500" width="230" height="160" fill="#f4f8ff" stroke="black" stroke-width="2"/>
  <text x="380" y="492" font-weight="bold">U1 TLV3502AIDCNR (dual, SOT-23-8)</text>
  <g font-size="12">
    <text x="388" y="525">A: +IN RDP, -IN RDM</text><text x="620" y="525">OUT A -&gt; R11 33R -&gt; SLICE</text>
    <text x="388" y="555">B: +IN RDP, -IN VREF</text><text x="620" y="555">OUT B -&gt; R12 33R -&gt; SQUELCH</text>
    <text x="388" y="585">V+ 3V3 (C5 100 nF + C6 2.2 uF), V- GND</text>
    <text x="388" y="615">offset 6.5 mV max, hysteresis 6 mV,</text>
    <text x="388" y="635">tpd 4.5 ns typ (SBOS321E p.5-6)</text>
  </g>

  <g font-size="12">
    <text x="760" y="420" font-weight="bold">Predicted (ngspice, IHP pad models; CB1 step 3)</text>
    <text x="760" y="440">TD peak into 100 ohm, lossless magnetics: 1.541 V (slow, IO 3.2 V, 125 C)</text>
    <text x="760" y="458">to 1.944-1.96 V (fast, IO 3.4 V, -40 C), interpolated at 69.8 ohm:</text>
    <text x="760" y="476">inside 1.54-1.96 V with about 1 mV at the slow end.</text>
    <text x="760" y="496">Magnetics loss -1.0 dB (HR911105A maximum): no resistor value</text>
    <text x="760" y="514">holds both corners (shortfall about 1 % at each limit).</text>
    <text x="760" y="540">Squelch: 300 mV rejected (-50.5 mV overdrive), 585 mV accepted</text>
    <text x="760" y="558">(+33.5 mV at -1.0 dB loss); 802.3 14.3.1.3.2.</text>
    <text x="760" y="590">Supply: IOVDD of the chip +/-3 % assumed (3.2-3.4 V).</text>
    <text x="760" y="608">Half duplex with collision handling (fw/eth_10bt.s).</text>
  </g>
</svg>

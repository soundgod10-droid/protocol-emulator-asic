# Tiny Tapeout project information
project:
  title:        "Programmable protocol emulator"      # Project title
  author:       "Steven Anthony"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "4-thread barrel processor with timed pin I/O, loaded through a host SPI port"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_soundgod10_droid_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pe_sync.v"
    - "pe_cycle_counter.v"
    - "pe_timed_out.v"
    - "pe_cells.v"
    - "pe_latch_ram.v"
    - "pe_host_fifo.v"
    - "pe_timed_in.v"
    - "pe_config.v"
    - "pe_host_port.v"
    - "pe_core.v"
    - "pe_proc.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "IN8 processor input"
  ui[1]: "IN9 processor input"
  ui[2]: "IN10 processor input"
  ui[3]: "IN11 processor input (default UART RX)"
  ui[4]: "IN12 processor input"
  ui[5]: "HOST_MOSI"
  ui[6]: "HOST_CS_N"
  ui[7]: "HOST_SCK"

  # Outputs
  uo[0]: "OUT8 processor output"
  uo[1]: "OUT9 processor output"
  uo[2]: "OUT10 processor output"
  uo[3]: "OUT11 processor output"
  uo[4]: "OUT12 processor output (default UART TX)"
  uo[5]: "OUT13 processor output"
  uo[6]: "OUT14 processor output"
  uo[7]: "HOST_MISO"

  # Bidirectional pins
  uio[0]: "PIN0 processor pin (example SPI CS)"
  uio[1]: "PIN1 processor pin (example SPI MOSI)"
  uio[2]: "PIN2 processor pin (example SPI MISO)"
  uio[3]: "PIN3 processor pin (example SPI SCK)"
  uio[4]: "PIN4 processor pin"
  uio[5]: "PIN5 processor pin"
  uio[6]: "PIN6 processor pin (example I2C SCL)"
  uio[7]: "PIN7 processor pin (example I2C SDA)"

# Do not change!
yaml_version: 6

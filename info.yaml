# Tiny Tapeout project information
project:
  title:        "Work in progress"      # Project title
  author:       "Steven Anthony"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Work in progress"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_soundgod10_droid_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pe_sync.v"
    - "pe_cycle_counter.v"
    - "pe_timed_out.v"
    - "pe_uart_tx_seq.v"
    - "pe_cells.v"
    - "pe_latch_ram.v"
    - "pe_host_fifo.v"
    - "pe_timed_in.v"
    - "pe_config.v"
    - "pe_test_port.v"
    - "pe_core.v"
    - "pe_proc.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "TX_REQ (M1, temporary) / processor input 8"
  ui[1]: "processor input 9"
  ui[2]: "processor input 10"
  ui[3]: "processor input 11 (UART_RX)"
  ui[4]: "processor input 12"
  ui[5]: "TP_DAT (M2b test port, temporary)"
  ui[6]: "TP_CLK (M2b test port, temporary)"
  ui[7]: "CORE_SEL (M2b, temporary): 1 = processor pins"

  # Outputs
  uo[0]: "processor output 8"
  uo[1]: "processor output 9"
  uo[2]: "processor output 10"
  uo[3]: "processor output 11"
  uo[4]: "UART_TX (M1) / processor output 12"
  uo[5]: "TX_ACK (M1, temporary) / processor output 13"
  uo[6]: "processor output 14"
  uo[7]: "TP_OUT (M2b test port, temporary)"

  # Bidirectional pins
  uio[0]: "TX_DATA[0] in (M1, temporary) / processor pin 0"
  uio[1]: "TX_DATA[1] in (M1, temporary) / processor pin 1"
  uio[2]: "TX_DATA[2] in (M1, temporary) / processor pin 2"
  uio[3]: "TX_DATA[3] in (M1, temporary) / processor pin 3"
  uio[4]: "TX_DATA[4] in (M1, temporary) / processor pin 4"
  uio[5]: "TX_DATA[5] in (M1, temporary) / processor pin 5"
  uio[6]: "TX_DATA[6] in (M1, temporary) / processor pin 6"
  uio[7]: "TX_DATA[7] in (M1, temporary) / processor pin 7"

# Do not change!
yaml_version: 6
